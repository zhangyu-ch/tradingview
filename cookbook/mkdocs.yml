site_name: tradingview_zy 历史 cookbook 归档
site_description: '历史 cookbook 文档已迁移到 archive/docs/cookbook/'

docs_dir: ../archive/docs/cookbook

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - def_list

plugins:
  - search

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - python
    - yaml
  include_homepage_in_sidebar: true
  prev_next_buttons_location: both
  navigation_depth: 4
  collapse_navigation: true
  titles_only: false
  sticky_navigation: true
  locale: zh_CN

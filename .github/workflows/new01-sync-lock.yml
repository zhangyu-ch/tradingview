name: Sync NEW-01 lock metadata

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  sync-lock:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/fix-new-01-deprecation-warnings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-new-01-deprecation-warnings
          fetch-depth: 0
      - name: Synchronize bounded dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("uv.lock")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '{ name = "flask-login", specifier = ">=0.6.3" },':
                  '{ name = "flask-login", specifier = ">=0.6.3,<0.7" },',
              '{ name = "tornado", specifier = ">=6.5.1" },':
                  '{ name = "tornado", specifier = ">=6.5.1,<7" },',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one lock metadata entry {old!r}, found {count}"
                  )
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/new01-sync-lock.yml
          git diff --check
      - name: Publish synchronized lock file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock .github/workflows/new01-sync-lock.yml
          git commit -m "同步 NEW-01 依赖锁定范围"
          git push origin HEAD:agent/fix-new-01-deprecation-warnings

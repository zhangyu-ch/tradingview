name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  reject-remediation-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject temporary patch transport and force-push workflows
        run: python script/remediation/check_repository_hygiene.py

name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject temporary patch transport and force-push workflows
        run: python script/remediation/check_repository_hygiene.py
      - name: Verify dependency sources and lock compatibility
        run: python script/remediation/check_dependency_contract.py
      - name: Reject persisted secret exposure in settings UI
        run: python script/remediation/check_secret_exposure.py

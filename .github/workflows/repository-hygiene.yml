name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify executable quality-gate contract
        run: python script/remediation/check_quality_gates.py
      - name: Enforce explicit imports and audited exception boundaries
        run: python script/remediation/check_readability_contract.py
      - name: Reject temporary patch transport and force-push workflows
        run: python script/remediation/check_repository_hygiene.py
      - name: Verify dependency sources and lock compatibility
        run: python script/remediation/check_dependency_contract.py
      - name: Verify local artifacts and generated supply-chain evidence
        run: python script/remediation/check_supply_chain.py
      - name: Reject stale deterministic supply-chain evidence
        run: python script/remediation/generate_supply_chain_artifacts.py --check
      - name: Reject plaintext business secrets and direct consumers
        run: python script/remediation/check_secret_references.py
      - name: Reject persisted secret exposure in settings UI
        run: python script/remediation/check_secret_exposure.py

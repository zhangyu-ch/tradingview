name: Export source snapshot

on:
  pull_request:
    branches:
      - agent/internal-export-base-109

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package source tree
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.github/internal-export-trigger.txt \
            -czf /tmp/tradingview-source.tar.gz .
          sha256sum /tmp/tradingview-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tradingview-source-snapshot
          path: /tmp/tradingview-source.tar.gz
          retention-days: 1
          if-no-files-found: error

name: Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

env:
  UV_PYTHON_DOWNLOADS: never

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact uv
        run: python -m pip install "uv==0.10.0"
      - name: Verify lock file and install dependencies
        run: uv sync --locked
      - name: Prepare isolated test configuration
        run: python script/remediation/prepare_test_config.py
      - name: Run complete test suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: uv run pytest -q

  provider-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact uv
        run: python -m pip install "uv==0.10.0"
      - name: Install locked environment
        run: uv sync --locked
      - name: Prepare isolated test configuration
        run: python script/remediation/prepare_test_config.py
      - name: Run provider reliability matrix with strict warnings
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: >-
          uv run pytest -q -W error
          tests/test_hi13_binance_pagination.py
          tests/test_hi14_tq_lifecycle.py
          tests/test_me11_baostock_reliability.py
          tests/test_me12_tdx_contracts.py
          tests/test_me14_tdx_us_timezone.py
          tests/test_me15_futu_context_lifecycle.py
          tests/test_me16_ib_rpc_timeout.py
          tests/test_me17_qmt_contracts.py
          tests/test_mx17_tdx_node_selection.py
          tests/test_nx20_tdx_bounded_retry.py
          tests/test_footprint.py

  mysql-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-password
          MYSQL_DATABASE: tradingview_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact uv
        run: python -m pip install "uv==0.10.0"
      - name: Install locked environment
        run: uv sync --locked
      - name: Prepare isolated test configuration
        run: python script/remediation/prepare_test_config.py
      - name: Run real MySQL migration and long-content contract
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          RUN_MYSQL_TESTS: "1"
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: root-password
          MYSQL_DATABASE: tradingview_test
        run: uv run pytest -q -W error tests/test_me29_mysql_gate.py

  browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact uv
        run: python -m pip install "uv==0.10.0"
      - name: Install locked environment
        run: uv sync --locked
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Verify rendered settings DOM does not expose stored secrets
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          RUN_BROWSER_TESTS: "1"
        run: uv run pytest -q -W error tests/test_me29_browser_dom.py

  supply-chain-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact uv
        run: python -m pip install "uv==0.10.0"
      - name: Prove the lock is current
        run: uv lock --check
      - name: Install locked environment
        run: uv sync --locked
      - name: Validate local artifacts and committed evidence
        run: python script/remediation/check_supply_chain.py
      - name: Prove deterministic generated evidence
        run: python script/remediation/generate_supply_chain_artifacts.py --check
      - name: Generate installed-environment evidence
        run: >-
          python script/remediation/generate_supply_chain_artifacts.py
          --output-dir .artifacts/supply-chain
          --installed-licenses
      - name: Run live fail-closed OSV scan
        run: >-
          python script/remediation/scan_osv.py
          --output .artifacts/supply-chain/vulnerability-report.json
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          path: .artifacts/supply-chain
          if-no-files-found: error

  lock-refresh:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-ci-run-31272866468'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact uv
        run: python -m pip install "uv==0.10.0"
      - name: Correct scheduler status import without changing line endings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("web/tradingview_zy_chart/cl_app/__init__.py")
          old = b"from tradingview_zy.scheduler_runtime import SchedulerStatusStore"
          new = b"from tradingview_zy.scheduler_status import SchedulerStatusStore"
          content = path.read_bytes()
          if content.count(old) != 1:
              raise SystemExit("expected exactly one scheduler status import")
          path.write_bytes(content.replace(old, new))
          PY
      - name: Refresh lock and committed supply-chain evidence
        run: |
          uv lock --upgrade
          python script/remediation/generate_supply_chain_artifacts.py
      - name: Upload refreshed lock and evidence
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-lock-and-supply-chain
          path: |
            uv.lock
            audit/supply-chain/sbom.cdx.json
            audit/supply-chain/license-report.json
            audit/supply-chain/vulnerability-report.json
          if-no-files-found: error
      - name: Commit generated and targeted repairs to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock audit/supply-chain/sbom.cdx.json audit/supply-chain/license-report.json audit/supply-chain/vulnerability-report.json web/tradingview_zy_chart/cl_app/__init__.py
          if git diff --cached --quiet; then
            echo "Generated state and targeted import are already current."
            exit 0
          fi
          git commit -m "fix(web): use the scheduler status module"
          git push origin HEAD:${{ github.head_ref }}

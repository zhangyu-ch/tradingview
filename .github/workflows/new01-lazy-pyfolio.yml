name: Apply NEW-01 lazy pyfolio import

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/fix-new-01-deprecation-warnings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-new-01-deprecation-warnings
      - name: Remove pyfolio import-time side effects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/tradingview_zy/backtesting/backtest.py")
          text = path.read_text(encoding="utf-8")

          top_level_import = "import pyfolio as pf\n"
          if text.count(top_level_import) != 1:
              raise SystemExit("expected exactly one top-level pyfolio import")
          text = text.replace(top_level_import, "", 1)

          tear_sheet_call = "        pf.create_full_tear_sheet(\n"
          if text.count(tear_sheet_call) != 1:
              raise SystemExit("expected exactly one pyfolio tear-sheet call")
          text = text.replace(
              tear_sheet_call,
              "        # pyfolio is optional and emits a zipline warning at import time.\n"
              "        # Import it only when the tear-sheet feature is actually requested.\n"
              "        import pyfolio as pf\n\n"
              + tear_sheet_call,
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/new01-lazy-pyfolio.yml
          python -m py_compile src/tradingview_zy/backtesting/backtest.py
          git diff --check
      - name: Publish follow-up
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tradingview_zy/backtesting/backtest.py .github/workflows/new01-lazy-pyfolio.yml
          git commit -m "延迟加载可选 pyfolio 报告依赖"
          git push origin HEAD:agent/fix-new-01-deprecation-warnings
